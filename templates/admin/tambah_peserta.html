{% extends "base.html" %}
{% block title %}Tambah Peserta - Absensi Event{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-person-plus me-2"></i>Tambah Peserta</h4>
            <a href="{{ url_for('admin_peserta') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Kembali</a>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" name="nama" class="form-control" placeholder="Masukkan nama lengkap" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="email@contoh.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">No. HP</label>
                        <input type="text" name="nohp" class="form-control" placeholder="08xxxxxxxxxx">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Divisi / Kelompok</label>
                        <input type="text" name="divisi" class="form-control" placeholder="Divisi atau kelompok">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-plus-circle me-2"></i>Tambah & Generate QR
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted"><i class="bi bi-info-circle me-1"></i>QR Code akan otomatis dibuat setelah peserta ditambahkan</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
